name: Release

on:
  push:
    tags:
      - 'v9.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在 tag（例如 v9.9.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Ensure PHP CLI
        run: |
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-cli
          fi
          php -v | head -1

      - name: Resolve version and verify against tag
        id: ver
        run: |
          set -euo pipefail
          version="${TAG#v}"
          config_version=$(grep -oP "config->version\s*=\s*'\K[^']+" config/config.php | head -1)
          file_version=$(tr -d '[:space:]' < VERSION)
          client_version=$(grep -oP "^VERSION\s*=\s*'\K[^']+" zentao-mcp-py/mcp.py | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "client_version=$client_version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG / config=$config_version / VERSION=$file_version / mcp-client=$client_version"
          test "$version" = "$config_version" || { echo "::error::tag $TAG 与 config/config.php 版本 $config_version 不一致"; exit 1; }
          test "$version" = "$file_version"  || { echo "::error::tag $TAG 与 VERSION 文件 $file_version 不一致"; exit 1; }

      - name: PHP lint (all sources)
        run: |
          set -euo pipefail
          # module/*/ext/model/ 下两个文件是"部分类体"扩展（框架运行时并入类再执行），不单独参与 lint
          skip='./module/common/ext/model/mcp.php ./module/user/ext/model/wyauth.php'
          fail=0
          total=0
          while IFS= read -r -d '' f; do
            case " $skip " in *" $f "*) continue;; esac
            total=$((total + 1))
            php -l "$f" >/dev/null 2>&1 || { echo "::error::Lint failed: $f"; fail=1; }
          done < <(find . \( -path ./.git -o -path ./tmp -o -path ./www/data \) -prune -o -name '*.php' -print0)
          echo "linted $total php files"
          exit $fail

      - name: Build packages
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          C="${{ steps.ver.outputs.client_version }}"
          rm -rf dist staging
          mkdir -p dist staging/tmp

          # 1) 全量交付包：顶层直出（解压到部署目录即覆盖），.github/.gitignore 按 .gitattributes 排除
          #    注：git archive 不支持 --owner/--group，条目属主默认为 root/root
          git archive --format=tar -o dist/full.tar HEAD
          # git 不跟踪空目录（tmp/ 已取消跟踪，属运行期数据）：补 tmp/ 条目，保证全新安装的目录可写检查能通过
          tar --append --file=dist/full.tar --owner=0 --group=0 -C staging tmp
          gzip -9 dist/full.tar
          mv dist/full.tar.gz "dist/ZenTaoPMS-${V}-full.tar.gz"

          # 2) MCP 客户端独立包（服务端模块 module/mcp 随全量包发布，不单独出包）
          git archive --format=zip --prefix=zentao-mcp-py/ -o "dist/zentao-mcp-client-${C}.zip" HEAD:zentao-mcp-py

          # 3) 校验和
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
          ls -la dist/

      - name: Verify package contents
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          C="${{ steps.ver.outputs.client_version }}"
          rm -rf verify
          mkdir -p verify
          tar -xzf "dist/ZenTaoPMS-${V}-full.tar.gz" -C verify

          # 关键文件必须在
          test -f verify/config/config.php
          test -f verify/www/index.php
          test -f verify/www/upgrade.php
          test -f verify/module/upgrade/model.php
          test -f verify/module/upgrade/control.php
          test -f verify/module/mcp/model.php
          test -f verify/zentao-mcp-py/mcp.py
          test -f verify/bin/ztcli
          test -f verify/www/ok.txt
          test -d verify/tmp
          test -d verify/www/data
          # 敏感/无关内容必须不在
          test ! -e verify/config/my.php
          test ! -e verify/.github
          test ! -e verify/.gitignore
          test ! -e verify/.gitattributes
          # 版本一致性
          grep -q "$V" verify/config/config.php
          # 升级守卫就位（社区版白名单 + 官方版拒绝）
          grep -q "isWenyinVersion" verify/module/upgrade/model.php
          grep -q "printUnsupportedSource" verify/module/upgrade/model.php
          # 客户端包结构
          unzip -l "dist/zentao-mcp-client-${C}.zip" | grep -q "zentao-mcp-py/mcp.py"
          # 校验和自检
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          C="${{ steps.ver.outputs.client_version }}"
          cat > notes.md <<'EOF'
          ## ZenTaoPMS {{VERSION}} 全量交付包

          **9.8.3 功能内核 + 10.1 全新界面**（非官方社区定制版）。
          本包可直接解压到线上部署目录覆盖，然后执行升级。

          ---

          ## 新特性：9.8.3_1 → {{VERSION}}

          ### 一、界面层（移植禅道 10.1）

          - **全新界面**：10.1 应用骨架（页头/导航/页脚）、615 个页面模板、126 个语言文件、皮肤基座整体移植（`feat/ui-101`）。
          - **前端框架升级**：ZUI 1.7 → 1.8.1（对齐 10.1，补齐 timeSpanControl 等 API），新增兼容层 `www/theme/default/compat.css` + `www/js/compat.js` 保证老页面正常渲染。
          - **三款主题**：WenYin 紫色（默认）/ 亮蓝 / 黑莓；WenYin 由 10.1 purple 基座重制（`#3123ae → #6f42c1` 紫色系映射）。
          - **仪表盘新版式**：我的地盘/产品/项目/测试四类仪表盘静默迁移到 10.1 布局（左右分栏、欢迎块统计磁贴、统计块进度环），无需用户确认。
          - **移动端全面适配**：三主题通用响应式（仪表盘单栏堆叠、导航横滑、页脚自适应），修复页脚重叠/裁切问题。
          - **细节修复**：进度环负半径崩溃、表头排序错位、多行文本框压扁、项目页坏链接、菜单激活态失效等。

          ### 二、功能特性（自 9.8.3 内核新移植）

          - **动态流**（我的/组织/产品/项目/用户，5 处）：按日期分组展示 + 双向翻页（更早/更新），重点动作高亮。
          - **文档收藏**：星标收藏/取消文档与文档库，新增「我的收藏」浏览入口与首页统计。
          - **文档统计**：文档首页统计卡（所有文档/今日更新/最近更新进度环）。
          - **父任务日期自动汇总**：子任务日期变更自动回写父任务（最早开始/最晚截止）。
          - **项目概览统计**：项目概览页展示关联需求/任务/Bug 数量与燃尽图。
          - **待办批量关闭**：我的待办支持勾选批量关闭（独立权限点）。
          - **测试报告图表**：测试报告页展示用例结果/类型/模块/执行人分布图。
          - **项目树状图**：树状视图节点渲染 + 右侧需求/任务详情面板。
          - **看板升级**：泳道维度扩展为 需求/模块/指派人/优先级；同列拖拽排序（顺序按维度存 `zt_config`，零表结构变更，跨列拖拽仍走状态机）；泳道折叠（localStorage）。
          - **用例库导出**：按当前浏览条件或勾选导出用例 CSV，字段与导入模板同构（可导出→改→再导入），附件列输出标题 + 可下载地址；列表页新增「导出用例/编辑库/删除库」入口。

          ### 三、平台能力（v9.9.0 全量包含）

          - **MCP 集成（zentao-mcp）**：63 个工具覆盖任务/需求/Bug/项目/产品/计划/发布/测试/文档全生命周期；git 提交驱动工作流（`task #N` 标记联动）；双层 MD5 签名鉴权 + 个人密钥体系（防冒充署名）+ 写入审计。
          - **统一认证（SSO）**：接入 wenyinos 认证中心，登录/登出/改密全域同步，支持组准入控制。
          - **升级流程（社区版单通道）**：仅支持 9.8.3_1 及后续社区版本升级；官方禅道数据库会被明确拒绝，防止数据损坏；支持 CLI 升级通道（免放开 Web 入口）。
          - **发布自动化**：本包由 GitHub Actions 自动构建（全量 lint + 版本三重校验 + 包内容断言 + SHA256 校验和）。

          ### 四、问题修复

          - 修复游客访问仪表盘被权限守卫掐断导致页面半截的问题。
          - 修复移动端页脚版权信息与面包屑重叠/不可见的问题。
          - 修复文档模块「界面已就位、后端缺失」的系列断链（收藏按钮报错、统计空白等）。
          - 修复页面左上角切换器（项目/产品/分支/用例库/模块）点击无响应且错位的问题：改用 10.1 的 ZUI `dropdown + search-list` 机制（ajax 加载 + 即时过滤），并清理 `compat.css` 中冲突的旧 `#dropMenu`/`#currentItem` 规则。
          - 修复产品页、用例库页切换器整块缺失的问题（旧实现注入的菜单键在 10.1 语言包中已不存在）。
          - 修复用例库切换器的 ajax 下拉报「The param 'extra' should pass value」（`testsuite`/`tree` 的 `ajaxGetDropMenu` 补默认参数）。
          - **修复燃尽图 500（9.9.0 既有缺陷）**：工期为 0 的项目 `$project->days` 被置为空串，直接参与除法在 PHP 8 抛 `TypeError: Unsupported operand types: string / string`；两侧强制 int 并保证除数 ≥ 1。
          - 修复用例库删除时报 `Attempt to read property on null`（控制层未取 `$suite` 对象）。
          - 修复文档目录内的文档在文档库「全部」视图不显示、「所有文档」统计少算（`getPrivDocs` 对齐 22.6 写法）。
          - 版本号规则放开为支持 `9.10.0` 形式（仍拒绝官方禅道版本）。

          ---

          ## 包内组成

          - 完整源码（`framework/` `module/` `www/` `lib/` 等全量文件）
          - MCP 服务端模块 `module/mcp/`（标配组件，无需单独部署）
          - MCP Python 客户端 `zentao-mcp-py/`（单文件，仅需 `python3` + `git`）；也提供独立客户端包 `zentao-mcp-client-{{CLIENT_VERSION}}.zip`

          ## 覆盖部署（升级既有站点）

          ```bash
          # 0) 先备份数据库！

          # 1) 解压覆盖（不影响 config/my.php、附件与各 .env 密钥）
          cd /www/wwwroot/dev.wenyinos
          tar -xzf ZenTaoPMS-{{VERSION}}-full.tar.gz

          # 2) 修正可写目录属主（以 root 解压会重置 config/tmp/www/data 的属主与权限）
          chown -R www:www config tmp www/data

          # 3) 执行升级（CLI 通道，免放开 Web 入口；用 php-fpm 用户执行）
          sudo -u www /www/server/php/85/bin/php bin/ztcli 'http://dev.wenyinos.com/upgrade-execute.html'
          sudo -u www /www/server/php/85/bin/php bin/ztcli 'http://dev.wenyinos.com/upgrade-afterExec.html'

          # 4) 重载 php-fpm（清 opcache）
          ```

          - 升级来源仅限 **9.8.3_1**（首个社区定制版）及后续社区版本；官方禅道数据库会被明确拒绝，防止数据损坏。
          - Web 向导升级：需临时放行 nginx 的 `install|upgrade|checktable` 封禁行并 `touch www/ok.txt`，完成后立即恢复封禁。
          - 覆盖式解压只增改、不删除文件；历史遗留的 `db/update*.sql` 等废弃文件残留无害，可手动清理。

          ## 完整性校验

          ```bash
          sha256sum -c SHA256SUMS
          ```

          ## 全新安装

          解压后按 README「安装」章节执行：`chmod -R 777 tmp www/data config` → 浏览器打开 `/install.php` 完成后删除/封禁安装入口。

          > 本版本号 {{VERSION}} 为社区版专属（上游不存在该版本）；内核行为与禅道 9.8.3 一致，界面为 10.1 移植。
          EOF
          sed -i "s/{{VERSION}}/${V}/g; s/{{CLIENT_VERSION}}/${C}/g" notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "ZenTaoPMS ${V}（全量交付包 · 9.8.3 内核 + 10.1 界面）" \
              --notes-file notes.md
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZenTaoPMS ${V}（全量交付包 · 9.8.3 内核 + 10.1 界面）" \
              --notes-file notes.md
          fi
